
[metadata]
name = kestro-timeregistration
version = 1.0.0
author = Jan Volckaert
author_email = janvolck@gmail.com
url = https://www.github.com/janvolck/kestro-timeregistration
description = Time registration system for tracking work hours and activities
long_description = file: README.md
long_description_content_type = text/markdown
keywords = kestro, time registration, work hours, activities
license = License :: Free For Home Use
classifiers =
    License :: Free For Home Use
    Programming Language :: Python :: 3

[options]
package_dir =
    = python
packages = find:
zip_safe = False
include_package_data = True
install_requires =
    chevron
    colorama
    flask
    flask-cors
    flask-jsonpify
    flask-restful
    flask-sqlalchemy
    openpyxl
    pandas
    waitress
    zeroconf

[options.packages.find]
where=python

[options.entry_points]
console_scripts =
    kestro_timeregistration = kestro_timeregistration.command_line:main


[options.package_data]
* = webapp/templates/*.html, webapp/templates/*.htm, static/*.*, README.md
